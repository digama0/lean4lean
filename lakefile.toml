name = "lean4lean"
defaultTargets = ["Lean4Lean", "lean4lean", "Lean4Lean.Theory", "Lean4Lean.Verify"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "Lean4Lean"

[[lean_lib]]
name = "Lean4Lean.Theory"
globs = ["Lean4Lean.Theory.*"]

[[lean_lib]]
name = "Lean4Lean.Verify"
globs = ["Lean4Lean.Verify.*"]

# WAVE 1E COMPAT: `Lean4Lean/Tests.lean` is the manifest of the test modules (its imports);
# a test whose imports do not build yet is listed there with the wave that adds it back.
[[lean_lib]]
name = "Lean4Lean.Tests"

[[lean_lib]]
name = "Lean4Lean.Experimental"
globs = ["Lean4Lean.Experimental.+"]

[[lean_exe]]
name = "lean4lean"
root = "Main"
supportInterpreter = true
